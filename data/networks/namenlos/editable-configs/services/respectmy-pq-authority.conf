BACKEND=freebsd-ezjail
JAIL=respectmy
UNIT=katzenpost
BUILD=dirauth
BINARY_SRC=cmd/dirauth/dirauth
BINARY_DST=/usr/local/sbin/kpdirauth
CONFIG_SRC=configs/respectmy-pq-authority.toml
CONFIG_DST=/usr/local/etc/katzenpost/authority/config.toml
KEYS_SRC="keys/mix-id-keys keys/servicenode-id-keys keys/gateway-id-keys keys/replica-id-keys"
STATE_DIR=/var/lib/pq-katzenpost-authority
SECRET_KEYS="identity.private.pem *.private*.pem"
PRESTART_HOOK="rm -f /var/lib/pq-katzenpost-authority/persistence.db"

[network]
pkiSignatureScheme = "Ed25519 Sphincs+"
wireKEMScheme = "KYBER768-X25519"
replicaNIKEScheme = "CTIDH1024-X25519"

  [network.parameters]
  Mu = 0.001
  LambdaP = 0.001
  LambdaL = 0.0005
  LambdaM = 0.0005
  LambdaR = 0.02

  [network.layout]
  Layers = 3
  MinNodesPerLayer = 1

  [network.sphinx]
  PacketLength = 3082
  NrHops = 5
  HeaderLength = 476
  RoutingInfoLength = 410
  PerHopRoutingInfoLength = 82
  SURBLength = 572
  SphinxPlaintextHeaderLength = 2
  PayloadTagLength = 32
  ForwardPayloadLength = 2574
  UserForwardPayloadLength = 2000
  NextNodeHopLength = 65
  SPRPKeyMaterialLength = 64
  NIKEName = "x25519"
  KEMName = ""

  [network.mixDebug]
  SchedulerExternalMemoryQueue = false
  SchedulerQueueSize = 100000
  UnwrapDelay = 250
  SchedulerSlack = 450
  SendSlack = 50
  DecoySlack = 15000
  ConnectTimeout = 60000
  HandshakeTimeout = 60000
  ReauthInterval = 300000
  SendDecoyTraffic = true
  DisableRateLimit = false


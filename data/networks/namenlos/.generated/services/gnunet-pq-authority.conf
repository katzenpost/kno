BACKEND="systemd"
UNIT="kpauthority@gnunet-pq-authority"
BUILD="dirauth"
BINARY_SRC="cmd/dirauth/dirauth"
BINARY_DST="/usr/bin/kpdirauth"
CONFIG_SRC="configs/gnunet-pq-authority.toml"
CONFIG_DST="/etc/katzenpost/authority/gnunet-pq-authority.toml"
KEYS_SRC="keys/mix-id-keys keys/servicenode-id-keys keys/gateway-id-keys keys/replica-id-keys"
STATE_DIR="/var/lib/katzenpost/authority/gnunet-pq-authority"
SECRET_KEYS="identity.private.pem *.private*.pem"
JAIL=""
PRESTART_HOOK="rm -f /var/lib/katzenpost/authority/gnunet-pq-authority/persistence.db"
SERVICE_USER="katzenpost"
AUX_FILES=""
DOCKER_DIR=""
DOCKER_IMAGE=""
DOCKER_CONTAINER=""
DOCKER_PORTS=""
LEGACY_UNIT="pq-katzenpost-authority"
LEGACY_STATE_DIR="/var/lib/pq-katzenpost-authority"
LEGACY_CONFIG_DST="/etc/pq-katzenpost-authority/authority.toml"
LEGACY_KEEP=""
EXTRA_MOVES=""

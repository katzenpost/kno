default = "amd64"
default_os = "debian-13"

[arch]
  allmixedup = "amd64"
  annares = "ppc64el"
  cryptonymity = "amd64"
  firefly = "amd64"
  haywood = "amd64"
  lilly = "amd64"
  luscus = "amd64"
  mixy = "amd64"
  omelas = "amd64"
  oneeyedman = "arm64"
  reed = "amd64"
  respectmy = "amd64"
  tortuna = "amd64"
  wauland = "amd64"
  wauland2 = "amd64"
  windfall1 = "amd64"
  windfall2 = "amd64"
  windfallservice = "amd64"

[os]
  allmixedup = "freebsd-14.5"
  annares = "ubuntu-26.04"
  firefly = "debian-13"
  haywood = "ubuntu-24.04"
  lilly = "ubuntu-24.04"
  luscus = "debian-13"
  mixy = "ubuntu-25.04"
  omelas = "debian-13"
  oneeyedman = "debian-13"
  reed = "ubuntu-24.04"
  respectmy = "freebsd-14.5"
  tortuna = "debian-13"
  windfall1 = "debian-13"
  windfall2 = "debian-13"
  windfallservice = "debian-13"

[operators]
  [operators.allmixedup]
    nodes = ["allmixedup", "respectmy"]
  [operators.annares]
    nodes = ["annares", "haywood", "lilly", "mixy", "reed"]
  [operators.cryptonymity]
    nodes = ["cryptonymity", "wauland", "wauland2"]
  [operators.gnunet]
    nodes = ["firefly", "tortuna"]
  [operators.luscus]
    nodes = ["luscus", "oneeyedman"]
  [operators.omelas]
    nodes = ["omelas"]
  [operators.windfall]
    nodes = ["windfall1", "windfall2"]

[lan]

  [[lan.group]]
    nodes = ["allmixedup", "respectmy"]

  [[lan.group]]
    nodes = ["luscus", "oneeyedman"]

[placement]
  gnunet-pq-authority = "tortuna"
  gnunet-pq-gatewaynode = "firefly"
  windfall-pq-authority = "windfall1"
  windfall-pq-mixserver = "windfall1"
  windfall-pq-servicenode = "windfall2"
  windfall-pq-storagenode-2 = "windfall2"


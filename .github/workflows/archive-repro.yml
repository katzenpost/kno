name: archive-repro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-repro-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-archives:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-24.04-arm]
        go: [1.26.10, 1.27.2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: go test ./internal/build -run '^TestSourceArchivesMatchCommittedDigests$' -count=1 -v
        env:
          KNO_TEST_SOURCE_ARCHIVES: '1'
          GOTOOLCHAIN: go${{ matrix.go }}

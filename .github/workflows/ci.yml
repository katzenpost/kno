name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  sim:
    name: sim
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: reuse successful matching job
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/reuse.py --workflow ci.yml --job "sim"

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: ./.github/actions/build-cache
        with:
          scope: sim

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: env
        run: |
          {
            echo "KNO_REPO=$PWD"
            echo "KNO_ARTIFACTS=$RUNNER_TEMP/artifacts"
            echo "PKGS=/var/tmp/kno-sim-$(id -u)-cisim/pkgs"
            echo "SIM_ARTIFACTS=/var/tmp/kno-sim-$(id -u)-cisim/artifacts"
            echo "SIM=--emulate --epoch 5m --minimal-build"
          } >> "$GITHUB_ENV"

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: build kno
        run: go build -o "$RUNNER_TEMP/kno" ./cmd/kno

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: sim binaries
        run: 'python3 ci/timed.py compilation "$RUNNER_TEMP/kno" sim build --net cisim $SIM'

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: validate
        run: 'KNO_ARTIFACTS="$SIM_ARTIFACTS" "$RUNNER_TEMP/kno" sim validate'

      - name: register qemu
        if: ${{ steps.reuse.outputs.reused != 'true' && (!env.ACT) }}
        run: |
          d=1f1c20bb35e5fbe18a9e0de7883b3fa2267af0427dba4bdab9b7fd77a0594b4a
          img=docker.io/polyarch/qemu-user-static@sha256:$d
          docker run --rm --privileged "$img" --reset -p yes

      - name: apparmor pasta fixup
        if: ${{ steps.reuse.outputs.reused != 'true' && (!env.ACT) }}
        run: |
          p=/etc/apparmor.d/usr.bin.pasta
          sudo sed -i 's/^}$/  signal receive set=term peer=podman,\n}/' "$p"
          sudo apparmor_parser -r "$p"

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: keys
        run: '"$RUNNER_TEMP/kno" sim keys --net cisim --pkgs "$PKGS" $SIM'

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: configs
        run: '"$RUNNER_TEMP/kno" sim configs --net cisim $SIM'

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: up
        run: 'python3 ci/timed.py startup-and-consensus "$RUNNER_TEMP/kno" sim up --net cisim $SIM'

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: verify
        run: 'python3 ci/timed.py verification "$RUNNER_TEMP/kno" sim verify --net cisim $SIM'

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: message
        run: 'python3 ci/timed.py message-transfer "$RUNNER_TEMP/kno" sim message --net cisim $SIM'

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: probe
        run: '"$RUNNER_TEMP/kno" sim probe --net cisim $SIM'

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: down
        run: '"$RUNNER_TEMP/kno" sim down --net cisim $SIM'

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: mutation
        run: |
          KNO="$RUNNER_TEMP/kno" SIM_PKGS="/var/tmp/kno-sim-$(id -u)-cisim/pkgs" \
            sh scripts/sim-mutation.sh

      - name: save builder images
        if: ${{ success() && steps.reuse.outputs.reused != 'true' }}
        continue-on-error: true
        run: python3 ci/images.py save

  build:
    name: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      sums: ${{ steps.reuse.outputs.sums || steps.build.outputs.sums }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: reuse successful matching job
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/reuse.py --workflow ci.yml --job "build" --sums

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: ./.github/actions/build-cache
        with:
          scope: build

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: env
        run: |
          t=$(sed -n 's/^KATZENPOST_REF=//p' data/thirdparty/pins.env)
          {
            echo "KNO_REPO=$PWD"
            echo "KNO_ARTIFACTS=$RUNNER_TEMP/artifacts"
            echo "PKGS=$RUNNER_TEMP/artifacts/releases/$t/pkgs"
          } >> "$GITHUB_ENV"

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: build
        id: build
        run: |
          go run ./cmd/kno build --arches amd64,arm64,ppc64el --skip-freebsd
          cat "$PKGS/packages.json"
          {
            echo 'sums<<EOF'
            cd "$PKGS" || exit
            for f in *; do
              case $f in kno[-_]*|packages.json|SHA256SUMS) ;; *) sha256sum "$f" ;; esac
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: save builder images
        if: ${{ success() && steps.reuse.outputs.reused != 'true' }}
        continue-on-error: true
        run: python3 ci/images.py save

  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/build-cache
        with:
          scope: test

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: CI reuse policy tests
        run: python3 -B -m unittest discover -s ci -p '*_test.py'

      - name: install linters
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          go install golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@v0.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: test
        env:
          GATES_SIM_IN_JOB: "1"
        run: make test

      - name: install
        run: make install-test

      - name: save builder images
        if: ${{ success() }}
        continue-on-error: true
        run: python3 ci/images.py save

  freebsd:
    name: freebsd
    outputs:
      sums: ${{ steps.reuse.outputs.sums || steps.pkgs.outputs.sums }}
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      GIT_AUTHOR_NAME: kno
      GIT_COMMITTER_NAME: kno
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: reuse successful matching job
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/reuse.py --workflow ci.yml --job "freebsd" --sums

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: ./.github/actions/build-cache
        with:
          scope: freebsd

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: env
        run: |
          t=$(sed -n 's/^KATZENPOST_REF=//p' data/thirdparty/pins.env)
          {
            echo "KNO_REPO=$PWD"
            echo "KNO_ARTIFACTS=$RUNNER_TEMP/artifacts"
            echo "PKGS=$RUNNER_TEMP/artifacts/releases/$t/pkgs"
            echo "PATH=$RUNNER_TEMP/bin:$PATH"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/kno" ./cmd/kno

      - name: kvm
        if: ${{ steps.reuse.outputs.reused != 'true' && (!env.ACT) }}
        run: |
          r='KERNEL=="kvm", GROUP="kvm", MODE="0666"'
          echo "$r, OPTIONS+=\"static_node=kvm\"" \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf expect

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/katzenpost/kno/freebsd
          key: freebsd-${{ hashFiles('data/thirdparty/pins.env') }}

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        name: pkgs
        id: pkgs
        run: |
          services=
          for cfg in data/networks/namenlos/.generated/services/*.conf; do
            if grep -qx 'BACKEND="freebsd-ezjail"' "$cfg"; then
              svc=${cfg##*/}
              services="$services${svc%.conf},"
            fi
          done
          services=${services%,}
          test -n "$services"
          kno build --services "$services"
          {
            echo 'sums<<EOF'
            cd "$PKGS" || exit
            for f in *; do
              case $f in kno[-_]*|packages.json|SHA256SUMS) ;; *) sha256sum "$f" ;; esac
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: vm install
        if: ${{ steps.reuse.outputs.reused != 'true' && (!env.ACT) }}
        run: make freebsd-vmtest

      - name: jail install
        if: ${{ steps.reuse.outputs.reused != 'true' && (!env.ACT) }}
        run: make freebsd-jailtest

      - name: kno in the jails
        if: ${{ steps.reuse.outputs.reused != 'true' && (!env.ACT) }}
        run: make freebsd-knotest

      - name: no kvm under act
        if: ${{ steps.reuse.outputs.reused != 'true' && (env.ACT) }}
        run: |
          echo "act runs this job as a user that cannot open /dev/kvm."
          echo "On the host, run: make freebsd-vmtest freebsd-jailtest" \
            "freebsd-knotest"

      - name: save builder images
        if: ${{ success() && steps.reuse.outputs.reused != 'true' }}
        continue-on-error: true
        run: python3 ci/images.py save

  gate:
    name: gate
    needs: [sim, build, test, freebsd]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: jobs
        run: |
          test "${{ needs.sim.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.freebsd.result }}" = success

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: hashes
        env:
          BUILD: ${{ needs.build.outputs.sums }}
          FREEBSD: ${{ needs.freebsd.outputs.sums }}
        run: |
          export LC_ALL=C
          t=$(sed -n 's/^KATZENPOST_REF=//p' data/thirdparty/pins.env)
          r=data/networks/namenlos/.generated/releases/$t
          printf '%s\n%s\n' "$BUILD" "$FREEBSD" | grep . | sort -u > "$RUNNER_TEMP/built"
          cat "$r"/SHA256SUMS "$r"/*/SHA256SUMS "$r"/nodes/*/SHA256SUMS \
            | sort -u > "$RUNNER_TEMP/rec"
          awk 'NR==FNR { r[$0]; n[$2]; next }
            ($2 in n) && !($0 in r) { print "differs: " $2; bad = 1 }
            END { exit bad }' "$RUNNER_TEMP/rec" "$RUNNER_TEMP/built"
          awk '$2 != "packages.json" { print $2 }' "$r"/SHA256SUMS "$r"/nodes/*/SHA256SUMS \
            | sort -u > "$RUNNER_TEMP/want"
          awk '{ print $2 }' "$RUNNER_TEMP/built" | sort -u > "$RUNNER_TEMP/got"
          missing=$(comm -23 "$RUNNER_TEMP/want" "$RUNNER_TEMP/got")
          [ -z "$missing" ] || { echo "not built: $missing"; exit 1; }

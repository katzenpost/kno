name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sim:
    name: sim
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    outputs:
      sums: ${{ steps.debs.outputs.sums }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: env
        run: |
          t=$(sed -n 's/^KATZENPOST_REF=//p' data/thirdparty/pins.env)
          {
            echo "KNO_REPO=$PWD"
            echo "KNO_ARTIFACTS=$RUNNER_TEMP/artifacts"
            echo "PKGS=$RUNNER_TEMP/artifacts/releases/$t/pkgs"
            echo "SIM=--emulate --epoch 5m"
          } >> "$GITHUB_ENV"

      - name: build kno
        run: go build -o "$RUNNER_TEMP/kno" ./cmd/kno

      - name: debs
        id: debs
        run: |
          "$RUNNER_TEMP/kno" build --arches amd64,arm64,ppc64el --skip-freebsd
          {
            echo 'sums<<EOF'
            cd "$PKGS"
            for f in *; do
              case $f in kno[-_]*|packages.json|SHA256SUMS) ;; *) sha256sum "$f" ;; esac
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: validate
        run: '"$RUNNER_TEMP/kno" sim validate'

      - name: register qemu
        if: ${{ !env.ACT }}
        run: |
          d=1f1c20bb35e5fbe18a9e0de7883b3fa2267af0427dba4bdab9b7fd77a0594b4a
          img=docker.io/polyarch/qemu-user-static@sha256:$d
          docker run --rm --privileged "$img" --reset -p yes

      - name: apparmor pasta fixup
        if: ${{ !env.ACT }}
        run: |
          p=/etc/apparmor.d/usr.bin.pasta
          sudo sed -i 's/^}$/  signal receive set=term peer=podman,\n}/' "$p"
          sudo apparmor_parser -r "$p"

      - name: keys
        run: '"$RUNNER_TEMP/kno" sim keys --net cisim --pkgs "$PKGS" $SIM'

      - name: configs
        run: '"$RUNNER_TEMP/kno" sim configs --net cisim $SIM'

      - name: up
        run: '"$RUNNER_TEMP/kno" sim up --net cisim $SIM'

      - name: verify
        run: '"$RUNNER_TEMP/kno" sim verify --net cisim $SIM'

      - name: message
        run: '"$RUNNER_TEMP/kno" sim message --net cisim $SIM'

      - name: probe
        run: '"$RUNNER_TEMP/kno" sim probe --net cisim $SIM'

      - name: down
        run: '"$RUNNER_TEMP/kno" sim down --net cisim $SIM'

      - name: mutation
        run: |
          KNO="$RUNNER_TEMP/kno" SIM_PKGS="/var/tmp/kno-sim-$(id -u)-cisim/pkgs" \
            sh scripts/sim-mutation.sh

  build:
    name: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      sums: ${{ steps.build.outputs.sums }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: env
        run: |
          t=$(sed -n 's/^KATZENPOST_REF=//p' data/thirdparty/pins.env)
          {
            echo "KNO_REPO=$PWD"
            echo "KNO_ARTIFACTS=$RUNNER_TEMP/artifacts"
            echo "PKGS=$RUNNER_TEMP/artifacts/releases/$t/pkgs"
          } >> "$GITHUB_ENV"

      - name: build
        id: build
        run: |
          go run ./cmd/kno build --arches arm64,ppc64el
          {
            echo 'sums<<EOF'
            cd "$PKGS"
            for f in *; do
              case $f in kno[-_]*|packages.json|SHA256SUMS) ;; *) sha256sum "$f" ;; esac
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install linters
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          go install golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@v0.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: test
        run: make test

      - name: install
        run: make install-test

  freebsd:
    name: freebsd
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      GIT_AUTHOR_NAME: kno
      GIT_COMMITTER_NAME: kno
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: env
        run: |
          t=$(sed -n 's/^KATZENPOST_REF=//p' data/thirdparty/pins.env)
          {
            echo "KNO_REPO=$PWD"
            echo "KNO_ARTIFACTS=$RUNNER_TEMP/artifacts"
            echo "PATH=$RUNNER_TEMP/bin:$PATH"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/kno" ./cmd/kno

      - name: kvm
        if: ${{ !env.ACT }}
        run: |
          r='KERNEL=="kvm", GROUP="kvm", MODE="0666"'
          echo "$r, OPTIONS+=\"static_node=kvm\"" \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf expect

      - uses: actions/cache@v6
        with:
          path: ~/.cache/katzenpost/kno/freebsd
          key: freebsd-${{ hashFiles('data/thirdparty/pins.env') }}

      - name: pkgs
        run: kno build --node respectmy

      - name: vm install
        run: make freebsd-vmtest

      - name: jail install
        run: make freebsd-jailtest

      - name: kno in the jails
        run: make freebsd-knotest

  gate:
    name: gate
    needs: [sim, build, test, freebsd]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: jobs
        run: |
          test "${{ needs.sim.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.freebsd.result }}" = success

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: hashes
        env:
          SIM: ${{ needs.sim.outputs.sums }}
          BUILD: ${{ needs.build.outputs.sums }}
        run: |
          export LC_ALL=C
          t=$(sed -n 's/^KATZENPOST_REF=//p' data/thirdparty/pins.env)
          r=data/networks/namenlos/.generated/releases/$t
          printf '%s\n%s\n' "$SIM" "$BUILD" | grep . | sort -u > "$RUNNER_TEMP/built"
          cat "$r"/SHA256SUMS "$r"/*/SHA256SUMS "$r"/nodes/*/SHA256SUMS \
            | sort -u > "$RUNNER_TEMP/rec"
          awk 'NR==FNR { r[$0]; n[$2]; next }
            ($2 in n) && !($0 in r) { print "differs: " $2; bad = 1 }
            END { exit bad }' "$RUNNER_TEMP/rec" "$RUNNER_TEMP/built"
          awk '$2 != "packages.json" { print $2 }' "$r"/SHA256SUMS "$r"/nodes/*/SHA256SUMS \
            | sort -u > "$RUNNER_TEMP/want"
          awk '{ print $2 }' "$RUNNER_TEMP/built" | sort -u > "$RUNNER_TEMP/got"
          missing=$(comm -23 "$RUNNER_TEMP/want" "$RUNNER_TEMP/got")
          [ -z "$missing" ] || { echo "not built: $missing"; exit 1; }

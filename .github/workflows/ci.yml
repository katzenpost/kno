name: ci

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: gates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install linters
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          go install golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@v0.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gates
        run: make test

  install:
    name: the packages install
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install test
        run: make install-test

  sim:
    name: configs load
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build katzenpost
        run: go run ./cmd/kno build --binary-only --arches "$(go env GOARCH)"

      - name: validate configs
        run: go run ./cmd/kno sim validate

  repro:
    name: reproduces the release
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: free disk
        if: ${{ !env.ACT }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null

      - name: repro
        run: KNO_ARTIFACTS="$RUNNER_TEMP/artifacts" make repro

  simnet:
    name: the network runs
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: free disk
        if: ${{ !env.ACT }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null

      - name: register qemu
        if: ${{ !env.ACT }}
        run: |
          img=docker.io/polyarch/qemu-user-static@sha256:1f1c20bb35e5fbe18a9e0de7883b3fa2267af0427dba4bdab9b7fd77a0594b4a
          docker run --rm --privileged "$img" --reset -p yes

      - name: build kno
        run: go build -o "$RUNNER_TEMP/kno" ./cmd/kno

      - name: apparmor pasta fixup
        if: ${{ !env.ACT }}
        run: |
          p=/etc/apparmor.d/usr.bin.pasta
          sudo sed -i 's/^}$/  signal receive set=term peer=podman,\n}/' "$p"
          sudo apparmor_parser -r "$p"

      - name: sim
        run: '"$RUNNER_TEMP/kno" sim all --emulate --epoch 5m --net cisim'

      - name: sim mutation
        run: |
          KNO="$RUNNER_TEMP/kno" SIM_PKGS="/var/tmp/kno-sim-$(id -u)-cisim/pkgs" \
            sh scripts/sim-mutation.sh

name: kno-packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kno-packages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ${{ matrix.builder.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        builder:
          - {runner: ubuntu-26.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
          - {runner: ubuntu-26.04, arch: ppc64le}
        target: [amd64, arm64, ppc64el]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: reuse successful matching job
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/reuse.py --workflow kno-packages.yml --job "package (${{ matrix.builder.runner }}, ${{ matrix.builder.arch }}, ${{ matrix.target }})"

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: ./.github/actions/build-cache
        with:
          scope: package-${{ matrix.builder.arch }}-${{ matrix.target }}

      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y podman
      - if: ${{ steps.reuse.outputs.reused != 'true' && (matrix.builder.arch == 'ppc64le') }}
        run: |
          docker run --rm --privileged docker.io/polyarch/qemu-user-static@sha256:1f1c20bb35e5fbe18a9e0de7883b3fa2267af0427dba4bdab9b7fd77a0594b4a --reset -p yes
      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        run: make kno-deb ARCH="$TARGET" DEBVER=0.0.107-1 EPOCH=1792480357
        env:
          TARGET: ${{ matrix.target }}
          KNO_BUILD_ARCH: ${{ matrix.builder.arch }}
      - if: ${{ steps.reuse.outputs.reused != 'true' }}
        run: |
          test "$(dpkg-deb -f dist/kno/kno_0.0.107-1_${TARGET}.deb Architecture)" = "$TARGET"
          test "$(dpkg-deb -f dist/host-config/kno-host-config_0.0.107-1_all.deb Architecture)" = all
          python3 - <<'PY'
          import os
          from pathlib import Path
          binary = Path('dist/kno/.root/usr/bin/kno').read_bytes()
          assert binary[:4] == b'\x7fELF'
          assert int.from_bytes(binary[18:20], 'little') == {'amd64': 62, 'arm64': 183, 'ppc64el': 21}[os.environ['TARGET']]
          PY
        env:
          TARGET: ${{ matrix.target }}
      - name: FreeBSD host packages
        if: ${{ steps.reuse.outputs.reused != 'true' && (matrix.target == 'amd64') }}
        env:
          BUILDER: ${{ matrix.builder.arch }}
        run: |
          . data/thirdparty/pins.env
          mkdir -p dist/freebsd "$HOME/.cache/katzenpost/kno"
          podman run --rm --platform "linux/$BUILDER" \
            -v "$PWD:/repo:ro" -v "$PWD/dist/freebsd:/out:rw" \
            -v "$HOME/.cache/katzenpost/kno:/cache:rw" \
            -e KNO_CACHE=/cache -e GOMODCACHE=/cache/gomodcache \
            -e GOCACHE=/cache/gobuild -w /repo \
            "${BUILD_IMAGE%%:*}@$BUILD_IMAGE_DIGEST" \
            go run ./ci/freebsd-packages --out /out --version 0.0.107-1

      - name: save builder images
        if: ${{ success() && steps.reuse.outputs.reused != 'true' }}
        continue-on-error: true
        run: python3 ci/images.py save
